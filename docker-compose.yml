version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bhoomi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: land_registry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Hardhat EVM Blockchain Local Node
  blockchain:
    build:
      context: .
      dockerfile: docker/Dockerfile.blockchain
    container_name: bhoomi_blockchain
    restart: always
    ports:
      - "8545:8545"

  # 3. Node.js Express Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bhoomi_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      blockchain:
        condition: service_started
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/land_registry?schema=public"
      JWT_SECRET: "super-secure-production-jwt-key-minimum-32-chars-length"
      BLOCKCHAIN_RPC_URL: "http://blockchain:8545"
      CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      ADMIN_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      REGISTRAR_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      FRONTEND_URL: "http://localhost"
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  # 4. React Vite Frontend via Nginx
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: bhoomi_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:
